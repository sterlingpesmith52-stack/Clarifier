<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clarifier</title>

<link rel="stylesheet" href="universal.css">

<style>
    body {
        background: #ffffff;
        margin: 0;
        padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Header layout: logo + title left, nav buttons right */
    .header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        margin-bottom: 6px;
    }

    .header-left {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
    }

    .header-left img {
        height: 32px;
        width: auto;
        border-radius: 6px;
    }

    .title {
        font-size: 24px;
        font-weight: 600;
    }

    /* Right‑aligned navigation buttons */
    .header-nav {
        display: none; /* shown only when catalogueReturn=true */
        flex-direction: column;
        align-items: flex-end;
        text-align: right;
        gap: 6px;
    }

    /* Base button styling */
    .mf-button {
        width: auto;
        min-width: auto;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 14px;
        text-decoration: none;
        display: inline-block;
        background: #007aff;
        color: #fff;
    }

    /* Action buttons */
    .action-button {
        background: #007aff;
        color: #fff;
    }

    .secondary-button {
        background: #000;
        color: #fff;
    }

    textarea {
        width: 100%;
        height: 180px;
        padding: 12px;
        box-sizing: border-box;
        font-size: 16px;
        border-radius: 6px;
        border: 1px solid #ccc;
        resize: vertical;
    }

    .output-box {
        margin-top: 16px;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #fafafa;
        min-height: 120px;
        white-space: pre-wrap;
        font-size: 16px;
    }

    .button-row {
        margin-top: 12px;
        display: flex;
        gap: 10px;
    }
</style>
</head>

<body>

<!-- Header row: left = logo + title, right = nav buttons -->
<div class="header-row">

    <div class="header-left">
        <img src="IMG_1741.jpeg" alt="MicroFoundary Logo">
        <div class="title">Clarifier</div>
    </div>

    <div id="headerNav" class="header-nav">
        <a class="mf-button" href="/MicroWidgets/index.html">Return</a>
        <a class="mf-button" href="/Catalogue/index.html">Catalog</a>
    </div>

</div>

<textarea id="inputText" placeholder="Paste messy notes here..."></textarea>

<div class="button-row">
    <button class="mf-button action-button" onclick="clarifyText()">Clarify</button>
    <button class="mf-button secondary-button" onclick="clearAll()">Clear</button>
</div>

<div id="outputBox" class="output-box"></div>

<script>
function clarifyText() {
    const raw = document.getElementById("inputText").value;

    if (!raw.trim()) {
        document.getElementById("outputBox").textContent = "";
        return;
    }

    const lines = raw
        .split(/\n+/)
        .map(line => line.trim())
        .filter(line => line.length > 0)
        .map(line => "- " + line);

    document.getElementById("outputBox").textContent = lines.join("\n");
}

function clearAll() {
    document.getElementById("inputText").value = "";
    document.getElementById("outputBox").textContent = "";
}

/* Show right‑aligned header navigation when launched from MicroWidgets or Catalogue */
const params = new URLSearchParams(window.location.search);
if (params.get("catalogueReturn") === "true") {
    document.getElementById("headerNav").style.display = "flex";
}
</script>

</body>
</html>
