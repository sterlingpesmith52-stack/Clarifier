<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clarifier Micro‑Widget</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
        }

        /* MicroFoundary Header */
        .mf-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
            background: white;
            border-bottom: 1px solid #ddd;
        }

        .mf-logo {
            height: 32px;
            width: auto;
        }

        .mf-title {
            font-size: 1.4rem;
            margin: 0;
            padding: 0;
        }

        /* Widget Container */
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin-top: 20px;
        }

        textarea {
            width: 100%;
            height: 140px;
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #ccc;
            resize: none;
        }

        button {
            margin-top: 15px;
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            background: #0078d4;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #005ea0;
        }

        .output {
            margin-top: 20px;
            padding: 15px;
            background: #eef6ff;
            border-radius: 6px;
            min-height: 80px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <!-- MicroFoundary Header -->
    <div class="mf-header">
        <a href="/catalogue.html">
            <img src="/assets/microfoundary-logo.png" alt="MicroFoundary Logo" class="mf-logo">
        </a>
        <h1 class="mf-title">Clarifier</h1>
    </div>

    <!-- Main Widget -->
    <div class="container">
        <textarea id="inputText" placeholder="Enter text to clarify..."></textarea>

        <button onclick="clarifyText()">Clarify</button>

        <div id="output" class="output"></div>
    </div>

    <script>
        async function clarifyText() {
            const text = document.getElementById("inputText").value;

            const response = await fetch("/api/clarify", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text })
            });

            const data = await response.json();
            document.getElementById("output").textContent = data.clarified;
        }
    </script>

</body>
</html>
