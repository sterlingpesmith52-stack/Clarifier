<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clarifier</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#f5f5f7;
    color:#000;
    padding:20px;
}

.container{
    max-width:800px;
    margin:0 auto;
}

/* Header */

.header-left{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-bottom:18px;
}

.tool-logo{
    width:48px;
    height:48px;
    object-fit:contain;
    flex-shrink:0;
}

.tool-title{
    font-size:2.4rem;
    font-weight:700;
    line-height:1;
}

/* Input */

textarea{
    width:100%;
    height:190px;
    padding:16px;
    border:2px solid #d0d0d0;
    border-radius:16px;
    font-size:1.1rem;
    resize:none;
}

/* Buttons */

.button-row{
    display:flex;
    gap:16px;
    justify-content:center;
    margin:18px 0;
}

.btn{
    border:none;
    border-radius:12px;
    padding:14px 32px;
    font-size:1.1rem;
    font-weight:600;
    cursor:pointer;
}

.btn-primary{
    background:#007aff;
    color:#fff;
}

.btn-secondary{
    background:#000;
    color:#fff;
}

/* Output */

.output-box{
    width:100%;
    min-height:170px;
    padding:16px;
    border:2px solid #d0d0d0;
    border-radius:16px;
    background:#fff;
    overflow:auto;
    white-space:pre-wrap;
}

/* Purchase Button */

.purchase-section{
    text-align:center;
    margin:20px 0;
}

.buy-button{
    display:inline-block;
    background:#007aff;
    color:#fff;
    text-decoration:none;
    padding:12px 24px;
    border-radius:12px;
    font-weight:600;
    transition:background .2s ease;
}

.buy-button:hover{
    background:#005fcc;
}

/* Footer */

.footer{
    border-top:1px solid #d9d9d9;
    padding-top:14px;
    text-align:center;
    color:#666;
    font-size:.95rem;
    margin-top:20px;
}

/* Mobile */

@media (max-width:600px){

    body{
        padding:16px;
    }

    .tool-title{
        font-size:2rem;
    }

    .tool-logo{
        width:42px;
        height:42px;
    }

    textarea{
        height:170px;
    }
}
</style>
</head>
<body>

<div class="container">

    <div class="header-left">
        IMG_1741.jpeg
        <h1 class="tool-title">Clarifier</h1>
    </div>

    <textarea
        id="inputText"
        placeholder="Paste messy notes here..."></textarea>

    <div class="button-row">
        <button id="clarifyBtn" class="btn btn-primary">Clarify</button>
        <button id="clearBtn" class="btn btn-secondary">Clear</button>
    </div>

    <div id="outputText" class="output-box"></div>

    <div class="purchase-section">
        /Payment/payment.html?tool=Clarifier
            Buy This Tool
        </a>
    </div>

    <footer class="footer">
        Part of the MicroFox Tool Collection
    </footer>

</div>

<script>
const inputText = document.getElementById('inputText');
const outputText = document.getElementById('outputText');

document.getElementById('clarifyBtn').addEventListener('click', () => {

    const text = inputText.value.trim();

    if (!text) {
        outputText.textContent = '';
        return;
    }

    const clarified = text
        .replace(/\s+/g, ' ')
        .replace(/\. /g, '.\n\n');

    outputText.textContent = clarified;
});

document.getElementById('clearBtn').addEventListener('click', () => {
    inputText.value = '';
    outputText.textContent = '';
    inputText.focus();
});
</script>

</body>
</html>
