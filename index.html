<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clarifier</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #ffffff;
        }

        /* CHROME-SAFE LOGO SIZING */
        .logo {
            height: 40px;
            max-height: 40px;
            width: auto;
            object-fit: contain;
            display: block;        /* removes Chrome baseline padding */
            margin-bottom: 6px;    /* pulls title up */
        }

        /* TITLE */
        .title {
            font-size: 28px;
            font-weight: 600;
            color: #000000;
            margin-bottom: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: flex-start; /* left-align everything */
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: none;
        }

        textarea:focus {
            outline: none;
            border-color: #000000;
            box-shadow: none;
        }

        /* MICRO-TIMER BLUE BUTTON — AUTO-SIZED + LEFT-JUSTIFIED */
        button {
            padding: 10px 16px;
            font-size: 16px;
            border: none;
            border-radius: 6px;

            background: #0078FF;   /* MicroTimer blue */
            color: #ffffff;

            cursor: pointer;

            width: auto;           /* only as wide as the text */
            display: inline-block; /* left-justified */
        }

        button:hover {
            opacity: 0.85;
        }

        .output {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            min-height: 120px;
            background: #fafafa;
            width: 100%;
        }
    </style>
</head>

<body>

    <!-- LOGO -->
    <img src="IMG_1669.jpeg" class="logo" alt="Clarifier Logo">

    <!-- TITLE -->
    <div class="title">Clarifier</div>

    <div class="container">
        <textarea id="inputText" placeholder="Paste text here…"></textarea>
        <button onclick="clarify()">Clarify Text</button>
        <div class="output" id="outputBox"></div>
    </div>

    <script>
        function clarify() {
            const text = document.getElementById("inputText").value.trim();
            const output = document.getElementById("outputBox");

            if (!text) {
                output.textContent = "Please enter text to clarify.";
                return;
            }

            const clarified = text
                .replace(/\.\s+/g, ".\n")
                .replace(/;\s+/g, ";\n")
                .replace(/:\s+/g, ":\n")
                .replace(/,\s+/g, ", ");

            output.textContent = clarified;
        }
    </script>

</body>
</html>
