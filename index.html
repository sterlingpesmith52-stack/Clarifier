<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clarifier</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #ffffff;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-start;
            padding: 20px;
        }

        .logo {
            height: 32px;
            max-width: 120px;
            width: auto;
            object-fit: contain;
            display: block;
            margin-bottom: 4px; /* UPDATED: now exactly 4px */
        }

        .title {
            font-size: 28px;
            font-weight: 600;
            color: #000000;
            margin-bottom: 12px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: none;
            box-sizing: border-box;
        }

        textarea:focus {
            outline: none;
            border-color: #000000;
            box-shadow: none;
        }

        button {
            padding: 10px 16px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            background: #0078FF;
            color: #ffffff;
            cursor: pointer;
            width: auto;
            display: inline-block;
        }

        button:hover {
            opacity: 0.85;
        }

        .output {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            min-height: 120px;
            background: #ffffff;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <div class="container">

        <img src="IMG_1669.jpeg" class="logo" alt="Clarifier Logo">

        <div class="title">Clarifier</div>

        <textarea id="inputText" placeholder="Paste text here…"></textarea>

        <button onclick="clarify()">Clarify Text</button>

        <div class="output" id="outputBox"></div>

    </div>

    <script>
        function clarify() {
            const text = document.getElementById("inputText").value.trim();
            const output = document.getElementById("outputBox");

            if (!text) {
                output.textContent = "Please enter text to clarify.";
                return;
            }

            const clarified = text
                .replace(/\.\s+/g, ".\n")
                .replace(/;\s+/g, ";\n")
                .replace(/:\s+/g, ":\n")
                .replace(/,\s+/g, ", ");

            output.textContent = clarified;
        }
    </script>

</body>
</html>
