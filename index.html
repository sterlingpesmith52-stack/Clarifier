<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clarifier Micro‑Widget</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #f5faff;
      color: #333;
    }

    h1 {
      margin-bottom: 10px;
      text-align: center;
      font-size: 20px;
    }

    .container {
      background: #eaf4ff;
      padding: 20px 24px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      max-width: 400px;
      margin: 0 auto;
    }

    textarea {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      display: block;
      margin: 20px auto 0;
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background: #0078d4;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #005fa3;
    }

    .output {
      margin-top: 30px;
      padding: 14px;
      background: #eef6ff;
      border-left: 4px solid #0078d4;
      border-radius: 6px;
      white-space: pre-wrap;
      min-height: 120px;
      box-sizing: border-box;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Clarifier</h1>

    <textarea id="inputText" rows="5" placeholder="Type something…"></textarea>

    <button onclick="clarifyText()">Clarifier</button>

    <div id="output" class="output"></div>
  </div>

  <script>
    function clarifyText() {
      const input = document.getElementById('inputText').value.trim();
      const output = document.getElementById('output');

      if (!input) {
        output.textContent = "Please enter text to clarify.";
        return;
      }

      const clarified = "Clarified version:\n\n" + input.replace(/\s+/g, ' ').trim();
      output.textContent = clarified;
    }
  </script>
</body>
</html>
