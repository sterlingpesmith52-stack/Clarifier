<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clarifier</title>

<!-- Universal Stylesheet -->
<link rel="stylesheet" href="universal.css">

<style>
    body {
        background: #ffffff;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 20px;
    }

    .header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
    }

    .header img {
        height: 48px;
        width: auto;
        border-radius: 6px;
    }

    .title {
        font-size: 26px;
        font-weight: 600;
    }

    /* Navigation buttons (black) come from universal.css via .mf-button */

    /* Action buttons (blue) override only the color */
    .action-button {
        background: #007aff; /* iOS blue */
        color: #fff;
    }

    textarea {
        width: 100%;
        height: 180px;
        padding: 12px;
        font-size: 16px;
        border-radius: 6px;
        border: 1px solid #ccc;
        resize: vertical;
    }

    .output-box {
        margin-top: 16px;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #fafafa;
        min-height: 120px;
        white-space: pre-wrap;
        font-size: 16px;
    }

    .button-row {
        margin-top: 12px;
        display: flex;
        gap: 10px;
    }

    /* Stacked navigation buttons */
    #returnButtons {
        display: none;            /* hidden unless ?catalogTest=true */
        flex-direction: column;   /* stack vertically */
        gap: 8px;                 /* spacing between buttons */
        margin-top: 10px;
    }
</style>
</head>

<body>

<div class="header">
    <img src="IMG_1741.jpeg" alt="MicroFoundary Logo">
    <div class="title">Clarifier</div>
</div>

<!-- Stacked navigation buttons (conditionally shown) -->
<div id="returnButtons">
    <a class="mf-button" href="/index.html">MicroFoundary Home</a>
    <a class="mf-button" href="/MicroWidgets/Catalogue/index.html">Catalogue</a>
</div>

<textarea id="inputText" placeholder="Paste messy notes here..."></textarea>

<div class="button-row">
    <button class="mf-button action-button" onclick="clarifyText()">Clarify</button>
    <button class="mf-button action-button" onclick="clearAll()">Clear</button>
</div>

<div id="outputBox" class="output-box"></div>

<script>
function clarifyText() {
    const raw = document.getElementById("inputText").value;

    if (!raw.trim()) {
        document.getElementById("outputBox").textContent = "";
        return;
    }

    const lines = raw
        .split(/\n+/)
        .map(line => line.trim())
        .filter(line => line.length > 0)
        .map(line => "- " + line);

    document.getElementById("outputBox").textContent = lines.join("\n");
}

function clearAll() {
    document.getElementById("inputText").value = "";
    document.getElementById("outputBox").textContent = "";
}

/* Show stacked navigation buttons only when launched from Catalogue */
const params = new URLSearchParams(window.location.search);
if (params.get("catalogTest") === "true") {
    document.getElementById("returnButtons").style.display = "flex";
}
</script>

</body>
</html>
