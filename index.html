
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clarify Micro‑Widget</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background: #f7f7f7;
      color: #333;
    }

    h1 {
      margin-bottom: 10px;
    }

    .container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      max-width: 600px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 20px;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background: #0078d4;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #005fa3;
    }

    .output {
      margin-top: 30px;
      padding: 15px;
      background: #eef6ff;
      border-left: 4px solid #0078d4;
      border-radius: 6px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Clarify Micro‑Widget</h1>
    <p>Enter text below and the widget will clarify it.</p>

    <label for="inputText">Text to Clarify:</label>
    <textarea id="inputText" rows="5" placeholder="Type something…"></textarea>

    <button onclick="clarifyText()">Clarify</button>

    <div id="output" class="output"></div>
  </div>

  <script>
    function clarifyText() {
      const input = document.getElementById('inputText').value.trim();
      const output = document.getElementById('output');

      if (!input) {
        output.textContent = "Please enter text to clarify.";
        return;
      }

      // Simple placeholder clarification logic
      const clarified = "Clarified version:\n\n" + input.replace(/\s+/g, ' ').trim();

      output.textContent = clarified;
    }
  </script>
</body>
</html>
