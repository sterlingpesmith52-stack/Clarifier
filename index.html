<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clarifier</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #ffffff;
        }

        .header-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .logo {
            height: 48px;   /* readable size */
            width: auto;
            display: block;
        }

        .title {
            font-size: 28px;
            font-weight: 600;
            color: #000000;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: none;
        }

        button {
            padding: 12px 16px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            background: #000000;
            color: #ffffff;
            cursor: pointer;
            width: fit-content;
        }

        button:hover {
            opacity: 0.85;
        }

        .output {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            min-height: 120px;
            background: #fafafa;
        }
    </style>
</head>

<body>

    <div class="header-row">
        <img src="./Photoroom_20260921_085342.jpeg" class="logo" alt="Clarifier Logo">
        <div class="title">Clarifier</div>
    </div>

    <div class="container">
        <textarea id="inputText" placeholder="Paste text here…"></textarea>
        <button onclick="clarify()">Clarify</button>
        <div class="output" id="outputBox"></div>
    </div>

    <script>
        function clarify() {
            const text = document.getElementById("inputText").value.trim();
            const output = document.getElementById("outputBox");

            if (!text) {
                output.textContent = "Please enter text to clarify.";
                return;
            }

            // Simple structural clarification
            const clarified = text
                .replace(/\.\s+/g, ".\n")
                .replace(/;\s+/g, ";\n")
                .replace(/:\s+/g, ":\n")
                .replace(/,\s+/g, ", ");

            output.textContent = clarified;
        }
    </script>

</body>
</html>
