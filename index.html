<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clarifier</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f5f7;
    color: #000;
    padding: 24px;
}

.container {
    max-width: 800px;
    margin: 0 auto;
}

/* Header */
.header-left {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
}

.tool-logo {
    width: 50px;
    height: 50px;
    object-fit: contain;
}

.tool-title {
    font-size: 2.5rem;
    font-weight: 700;
}

/* Input Areas */
textarea {
    width: 100%;
    min-height: 220px;
    padding: 16px;
    border: 2px solid #d0d0d0;
    border-radius: 16px;
    font-size: 1.1rem;
    resize: vertical;
}

.button-row {
    display: flex;
    gap: 16px;
    margin: 20px 0;
}

.btn {
    border: none;
    border-radius: 12px;
    padding: 14px 28px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
}

.btn-primary {
    background: #007aff;
    color: #fff;
}

.btn-secondary {
    background: #000;
    color: #fff;
}

.output-box {
    width: 100%;
    min-height: 220px;
    padding: 16px;
    border: 2px solid #d0d0d0;
    border-radius: 16px;
    background: #fff;
    margin-top: 12px;
}

/* Purchase Section */
.purchase-section {
    margin: 32px 0;
    text-align: center;
}

.buy-button {
    display: inline-block;
    background: #007aff;
    color: #fff;
    text-decoration: none;
    padding: 14px 28px;
    border-radius: 12px;
    font-weight: 600;
    transition: 0.2s;
}

.buy-button:hover {
    background: #005fcc;
}

/* Footer */
.footer {
    border-top: 1px solid #d9d9d9;
    padding-top: 24px;
    text-align: center;
    color: #666;
    font-size: 1rem;
}
</style>
</head>
<body>

<div class="container">

    <!-- Header -->
    <div class="header-left">
        IMG_1741.jpeg
        <h1 class="tool-title">Clarifier</h1>
    </div>

    <!-- Input -->
    <textarea
        id="inputText"
        placeholder="Paste messy notes here..."></textarea>

    <!-- Buttons -->
    <div class="button-row">
        <button class="btn btn-primary">Clarify</button>
        <button class="btn btn-secondary">Clear</button>
    </div>

    <!-- Output -->
    <div id="outputText" class="output-box"></div>

    <!-- Purchase Button -->
    <div class="purchase-section">
        /Payment/payment.html?tool=Clarifier

        </a>
    </div>

    <!-- Footer -->
    <footer class="footer">
        Part of the MicroFox Tool Collection
    </footer>

</div>

</body>
</html>
