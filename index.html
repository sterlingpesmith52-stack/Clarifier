<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clarifier</title>

<link rel="stylesheet" href="universal.css">

<style>
    body {
        background: #ffffff;
        margin: 0;
        padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Header */
    .header {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        margin-bottom: 16px;
    }

    .header img {
        height: 32px;
        width: auto;
        border-radius: 6px;
    }

    .title {
        font-size: 24px;
        font-weight: 600;
    }

    /* Right‑aligned navigation buttons */
    #returnButtons {
        display: none;
        flex-direction: column;
        align-items: flex-end;   /* right align */
        text-align: right;       /* right align text */
        gap: 8px;
        margin-bottom: 16px;
        width: 100%;             /* ensures right alignment */
    }

    /* Base button styling */
    .mf-button {
        width: auto;
        min-width: auto;
        padding: 8px 14px;
        border-radius: 6px;
        font-size: 14px;
        text-decoration: none;
        display: inline-block;
        flex: 0 0 auto;
        text-align: left;
        background: #007aff;
        color: #fff;
    }

    /* Clarify button (blue) */
    .action-button {
        background: #007aff;
        color: #fff;
    }

    /* Clear button (black) */
    .secondary-button {
        background: #000;
        color: #fff;
    }

    /* Input area */
    textarea {
        width: 100%;
        height: 180px;
        padding: 12px;
        padding-right: 12px;
        box-sizing: border-box;
        font-size: 16px;
        border-radius: 6px;
        border: 1px solid #ccc;
        resize: vertical;
    }

    /* Output box */
    .output-box {
        margin-top: 16px;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #fafafa;
        min-height: 120px;
        white-space: pre-wrap;
        font-size: 16px;
    }

    /* Tight-fit action buttons */
    .button-row {
        margin-top: 12px;
        display: flex;
        justify-content: flex-start;
        align-items: flex-start;
        gap: 10px;
        flex-wrap: nowrap;
    }
</style>
</head>

<body>

<div class="header">
    <img src="IMG_1741.jpeg" alt="MicroFoundary Logo">
    <div class="title">Clarifier</div>
</div>

<!-- Right‑aligned navigation buttons -->
<div id="returnButtons">
    <a class="mf-button" href="/index.html">MicroFoundary Home</a>
    <a class="mf-button" href="/MicroWidgets/index.html">MicroWidgets</a>
</div>

<textarea id="inputText" placeholder="Paste messy notes here..."></textarea>

<div class="button-row">
    <button class="mf-button action-button" onclick="clarifyText()">Clarify</button>
    <button class="mf-button secondary-button" onclick="clearAll()">Clear</button>
</div>

<div id="outputBox" class="output-box"></div>

<script>
function clarifyText() {
    const raw = document.getElementById("inputText").value;

    if (!raw.trim()) {
        document.getElementById("outputBox").textContent = "";
        return;
    }

    const lines = raw
        .split(/\n+/)
        .map(line => line.trim())
        .filter(line => line.length > 0)
        .map(line => "- " + line);

    document.getElementById("outputBox").textContent = lines.join("\n");
}

function clearAll() {
    document.getElementById("inputText").value = "";
    document.getElementById("outputBox").textContent = "";
}

/* Show right‑aligned navigation when launched from MicroWidgets or Catalogue */
const params = new URLSearchParams(window.location.search);
if (params.get("catalogueReturn") === "true") {
    document.getElementById("returnButtons").style.display = "flex";
}
</script>

</body>
</html>
