<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clarifier</title>

    <style>
        /* ---------- BASE LIGHT MODE ---------- */
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, sans-serif;
            background: #f7f7f7;
            color: #222;
            transition: background 0.3s, color 0.3s;
        }

        /* ---------- DARK MODE ---------- */
        body.dark-mode {
            background: #111;
            color: #eee;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        textarea {
            width: 100%;
            height: 140px;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            resize: none;
        }

        body.dark-mode textarea {
            background: #222;
            color: #eee;
            border: 1px solid #444;
        }

        button {
            margin-top: 12px;
            padding: 12px 16px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #0078d4;
            color: white;
        }

        body.dark-mode button {
            background: #005a9e;
        }

        #output {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            background: #fff;
            min-height: 80px;
            border: 1px solid #ddd;
            white-space: pre-wrap;
        }

        body.dark-mode #output {
            background: #1a1a1a;
            border: 1px solid #333;
        }

        .toggle {
            margin-top: 20px;
            text-align: center;
            cursor: pointer;
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Clarifier</h2>

        <!-- Environment diagnostic -->
        <div id="env-warning" style="display:none; padding:12px; background:#ffdddd; border:1px solid #cc0000; border-radius:8px; margin-bottom:20px;">
            You opened a preview or cached version.  
            Please launch the real <strong>index.html</strong> from File Explorer.
        </div>

        <textarea id="input" placeholder="Paste text to clarify..."></textarea>
        <button id="run">Clarify</button>

        <div id="output"></div>

        <div class="toggle" id="toggle">Toggle Dark Mode</div>
    </div>

    <script>
        /* ---------- ENVIRONMENT CHECK ---------- */
        const isLocal = window.location.protocol === "file:";
        if (!isLocal) {
            document.getElementById("env-warning").style.display = "block";
        }

        /* ---------- DARK MODE TOGGLE ---------- */
        const toggle = document.getElementById("toggle");
        toggle.addEventListener("click", () => {
            document.body.classList.toggle("dark-mode");
        });

        /* ---------- CLARIFIER ENGINE ---------- */
        function simplify(text) {
            // Basic structural simplification
            return text
                .trim()
                .replace(/\s+/g, " ")
                .replace(/\.{2,}/g, ".")
                .replace(/-\s+/g, "- ")
                .replace(/:\s+/g, ": ")
                .replace(/;\s+/g, "; ")
                .replace(/,\s+/g, ", ")
                .replace(/\s*([.!?])\s*/g, "$1\n")
                .trim();
        }

        document.getElementById("run").addEventListener("click", () => {
            const input = document.getElementById("input").value;
            const output = simplify(input);
            document.getElementById("output").textContent = output;
        });
    </script>
</body>
</html>
