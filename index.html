<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clarifier</title>

    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 0;
            padding: 20px;
            background: white;
            color: #222;
        }

        .container {
            max-width: 480px;
            margin: 0 auto;
        }

        .title {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: left;
        }

        .logo {
            width: 100%;
            max-width: 240px;
            display: block;
            margin-bottom: 20px;
        }

        textarea {
            width: 100%;
            height: 160px;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: none;
            box-sizing: border-box;
        }

        .button {
            display: inline-block;
            padding: 10px 16px;
            margin-top: 14px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            background: #0078d4;
            color: white;
            cursor: pointer;
            width: auto;
            text-align: left;
        }

        .output {
            margin-top: 20px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            min-height: 80px;
            font-size: 16px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>
    <div class="container">

        <img src="Photoroom-20260921-085342.jpeg" class="logo" alt="Clarifier Logo">

        <div class="title">Clarifier</div>

        <textarea id="inputText" placeholder="Paste text here…"></textarea>

        <button class="button" onclick="clarify()">Clarify Text</button>

        <div id="output" class="output"></div>

    </div>

    <script>
        function clarify() {
            const text = document.getElementById('inputText').value.trim();

            if (!text) {
                document.getElementById('output').textContent = "Please enter text to clarify.";
                return;
            }

            // Simple structural clarifier
            const clarified = text
                .replace(/\n{2,}/g, "\n")
                .replace(/\. /g, ".\n")
                .replace(/; /g, ";\n")
                .trim();

            document.getElementById('output').textContent = clarified;
        }
    </script>
</body>
</html>
